<div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3 md:w-3/4">
    <!-- License Plate Search -->
    <div class="w-full">
      <nv-input
        id="ticket-search-plate"
        label="Buscar Placa"
        placeholder="Ej. ABC123"
        startIcon="lucideSearch"
        [value]="filters().plate"
        (input)="onPlateInput($event)"
      />
    </div>

    <!-- Status Selector -->
    <div class="w-full">
      <nv-select
        id="ticket-filter-status"
        label="Estado"
        placeholder="Selecciona estado"
        [items]="statusOptions"
        [displayFn]="displayOptionFn"
        [valueFn]="valueOptionFn"
        [value]="filters().status"
        (valueChange)="onStatusChange($event)"
      />
    </div>

    <!-- Vehicle Type Selector -->
    <div class="w-full">
      <nv-select
        id="ticket-filter-vehicle"
        label="Tipo de Vehículo"
        placeholder="Selecciona tipo"
        [items]="vehicleOptions"
        [displayFn]="displayOptionFn"
        [valueFn]="valueOptionFn"
        [value]="filters().vehicleType"
        (valueChange)="onVehicleChange($event)"
      />
    </div>
  </div>

  <!-- Reset Button -->
  <div class="flex items-center">
    <nv-button
      type="button"
      variant="outline"
      size="md"
      class="w-full md:w-auto"
      (click)="onReset()"
    >
      <ng-icon name="lucideRotateCcw" size="16" />
      Limpiar Filtros
    </nv-button>
  </div>
</div>
